<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pribadi - Uti Risky Ramadhan</title>
    <!-- GOOGLE FONTS: Fredoka & Quicksand untuk Nuansa Manis Gulali -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }
        
        body {
            /* Tema Aksen Manis Gulali (Merah Kapas & Biru Bubblegum) */
            background-color: #ffcad4;
            background-image: 
                linear-gradient(135deg, rgba(255, 183, 178, 0.85), rgba(162, 210, 255, 0.85)),
                radial-gradient(circle at 20% 20%, #ffb7b2 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, #a2d2ff 0%, transparent 40%);
            background-size: cover;
            background-attachment: fixed;
            color: #4a4e69;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Hero / Header Section Berkesan Manis & Soft */
        .hero {
            background: linear-gradient(135deg, #ffffff, #ffe5ec);
            color: #ff5d8f;
            text-align: center;
            padding: 50px 20px;
            border-radius: 24px 24px 0 0;
            border: 3px solid #ffb7b2;
            border-bottom: none;
            box-shadow: 0 10px 30px rgba(255, 154, 162, 0.3);
            position: relative;
        }

        .hero h1 {
            font-family: 'Fredoka', cursive;
            font-size: 2.5rem;
            color: #ff4d6d;
            text-shadow: 2px 2px 0px #ffb7b2;
            margin-bottom: 8px;
        }

        .hero .tagline {
            display: inline-block;
            background: #a2d2ff;
            color: #ffffff;
            font-family: 'Fredoka', cursive;
            font-weight: 500;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(162, 210, 255, 0.4);
        }

        /* Pembatas Imut Bergaya Gulali */
        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 4px;
            background: linear-gradient(90deg, #ffb7b2, #a2d2ff, #ffb7b2);
            border-radius: 2px;
        }

        /* Kartu Konten Utama */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 40px 30px;
            border-radius: 0 0 24px 24px;
            border: 3px solid #ffb7b2;
            box-shadow: 0 15px 35px rgba(255, 183, 178, 0.25);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-item {
            background: #f0f7ff;
            padding: 16px 20px;
            border-radius: 16px;
            border-left: 5px solid #a2d2ff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .info-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(162, 210, 255, 0.3);
        }

        .info-item strong {
            display: block;
            font-family: 'Fredoka', cursive;
            color: #ff5d8f;
            font-size: 0.9rem;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-item span {
            font-size: 1.05rem;
            color: #3d5a80;
            font-weight: 600;
        }

        /* Responsif untuk Layar HP */
        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 10px;
            }
            .hero h1 {
                font-size: 1.8rem;
            }
            .card {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Hero Section -->
        <div class="hero">
            <h1>Uti Risky Ramadhan</h1>
            <span class="tagline">Bebas AI</span>
        </div>

        <!-- Kartu Biodata (Data Ditampilkan Kembali) -->
        <div class="card">
            <div class="info-grid">
                <div class="info-item">
                    <strong>Hobi</strong>
                    <span>Bolos tiap hari</span>
                </div>
                <div class="info-item">
                    <strong>Kota / Daerah</strong>
                    <span>Ketapang</span>
                </div>
                <div class="info-item">
                    <strong>Alamat</strong>
                    <span>Jl. Perdana Gg. 3</span>
                </div>
                <div class="info-item">
                    <strong>Email</strong>
                    <span>riskyramadhan1292009@gmail.com</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
